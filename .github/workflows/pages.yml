name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish VisibleSudoku.csproj -c Release -o out -p:Version=1.0.${{ github.run_number }}

      - name: Prepare for GitHub Pages
        run: |
          cd out/wwwroot
          # Site is served from /<repo>/, not the domain root.
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' index.html
          # SPA fallback for deep links, and stop Jekyll from hiding _framework.
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
