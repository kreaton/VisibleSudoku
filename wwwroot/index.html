<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VisibleSudoku" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000000" />
    <title>VisibleSudoku</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // Theme is applied before first paint to avoid a flash.
        try { document.documentElement.dataset.theme = localStorage.getItem('vs.theme') === 'dark' ? 'dark' : 'light'; }
        catch (e) { document.documentElement.dataset.theme = 'light'; }
        window.vsStorage = {
            get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
            remove: function (k) { try { localStorage.removeItem(k); } catch (e) { } },
            setTheme: function (t) {
                document.documentElement.dataset.theme = t;
                try { localStorage.setItem('vs.theme', t); } catch (e) { }
            }
        };
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="loading-title">VisibleSudoku</div>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
